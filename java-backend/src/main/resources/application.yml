server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: fleetdesk-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fleetdesk_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

fleetdesk:
  security:
    jwt-secret: ${JWT_SECRET:FleetDeskSecureKTUBTechAcademicSecretKey2024Scheme512BitLongKeyForHS512Algorithm}
    jwt-expiration-ms: 86400000 # 24 hours
  billing:
    default-penalty-multiplier: 1.5
    default-cancellation-fee: 200.00
