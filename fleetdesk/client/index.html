<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetDesk — Smart Vehicle Rental & Fleet Management System</title>
    <!-- Allowlisted Tailwind CSS from Google Antigravity -->
    <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[var(--background)] text-[var(--text-main)] antialiased min-h-screen">

    <!-- Auth View Container (Login & Register) -->
    <div id="auth-layout" class="min-h-screen flex items-center justify-center p-4"></div>

    <!-- Main SaaS Layout (Dashboard, Fleet, Bookings, etc.) -->
    <div id="app-layout" class="hidden flex h-screen overflow-hidden">
        <!-- Persistent Left Sidebar -->
        <aside id="sidebar-container" class="w-64 flex-shrink-0 transition-transform duration-300 md:translate-x-0 -translate-x-full fixed md:static inset-y-0 left-0 z-40 bg-[var(--card-bg)] shadow-lg md:shadow-none"></aside>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
            <!-- Top Navbar -->
            <div id="navbar-container"></div>

            <!-- Page Body -->
            <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto" id="main-content"></main>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="js/state.js"></script>
    <script src="js/components/icons.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components/toast.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/charts.js"></script>
    <script src="js/components/nav.js"></script>

    <!-- Views -->
    <script src="js/views/authViews.js"></script>
    <script src="js/views/dashboardView.js"></script>
    <script src="js/views/vehiclesView.js"></script>
    <script src="js/views/vehicleDetailsView.js"></script>
    <script src="js/views/bookingsView.js"></script>
    <script src="js/views/handoverReturnView.js"></script>
    <script src="js/views/billingView.js"></script>
    <script src="js/views/maintenanceView.js"></script>
    <script src="js/views/reportsView.js"></script>
    <script src="js/views/managementViews.js"></script>

    <!-- Router Initialization -->
    <script src="js/router.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            AppState.init();
            ClientRouter.init();
        });
    </script>
</body>
</html>
